name: Wagmo
description: >-
  Wagmo is a modern pet healthcare company offering three consumer products: Wagmo
  Wellness (a reimbursement plan covering routine and preventative care such as
  wellness visits, vaccines, dental cleanings, grooming, and supplements), Wagmo
  Insurance (accident-and-illness pet insurance for cats and dogs), and VETalk
  (24/7 virtual televet consultations). Wagmo also distributes its wellness and
  insurance products as an employee benefit through HR teams and brokers, and
  partners with pet brands. The company is a Techstars portfolio company. It
  operates as a direct-to-consumer and B2B2C brand and does not currently publish
  a public developer API, developer portal, or SDKs.
